codex:
  engine: sdk
  auth: api_key
  model: default
  sandbox: workspace-write
  fail_on: failed_or_blocked
  verbose: false
  allow_experimental_personal_hosted_auth: false

ios:
  project: MyApp.xcodeproj
  bundle_id:
  scheme: MyApp
  simulator: iPhone 17 Pro
  backend: xcodebuildmcp
  configuration: Debug

# Configure android instead of ios, or configure both. When both are present,
# unscoped QA cases run on both unless --platform selects one.
# android:
#   project: .
#   gradle_task: :app:assembleDebug
#   apk_path:
#   package_id: com.example.myapp
#   emulator: emulator-5554
#   backend: adb
#   launch_activity: .MainActivity

reports:
  output_dir: .shippilot
  markdown: true
  json: true
  junit: true
  screenshots: true
